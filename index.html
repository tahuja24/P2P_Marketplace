<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIET Campus Marketplace & Book Exchange</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [filter, setFilter] = React.useState('all');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [items, setItems] = React.useState([
        {
          id: 'ITEM-01',
          title: 'Environmental Engineering Textbook (Peavy)',
          category: 'Books',
          price: '₹450',
          condition: 'Like New',
          hostel: 'Hostel J',
          seller: 'Second-Year CS Student',
          description: 'Essential physical textbook for environmental studies and engineering coursework. Clean pages, no highlights.',
          status: 'Available'
        },
        {
          id: 'ITEM-02',
          title: 'Casio fx-991ES Plus Scientific Calculator',
          category: 'Electronics',
          price: '₹650',
          condition: 'Good',
          hostel: 'Hostel M (Anantam)',
          seller: 'Third-Year ECE Student',
          description: 'Fully functional scientific calculator, perfect for engineering drawing, calculus, and exams.',
          status: 'Available'
        },
        {
          id: 'ITEM-03',
          title: 'Hostel Study Table Lamp & Extension Cord',
          category: 'Dorm Gear',
          price: '₹300',
          condition: 'Fair',
          hostel: 'Hostel L (Viyat)',
          seller: 'Final Year Student',
          description: 'Adjustable LED study lamp with a 4-socket extension board. Great for late-night coding sessions.',
          status: 'Available'
        },
        {
          id: 'ITEM-04',
          title: 'Discrete Mathematical Structures Notes & Reference Book',
          category: 'Books',
          price: '₹250',
          condition: 'Like New',
          hostel: 'Hostel N',
          seller: 'Computer Engineering Student',
          description: 'Detailed handwritten lecture notes along with standard reference textbook for second-year core math.',
          status: 'Available'
        }
      ]);

      const [showModal, setShowModal] = React.useState(false);
      const [title, setTitle] = React.useState('');
      const [category, setCategory] = React.useState('Books');
      const [price, setPrice] = React.useState('');
      const [condition, setCondition] = React.useState('Like New');
      const [hostel, setHostel] = React.useState('Hostel J');
      const [description, setDescription] = React.useState('');

      React.useEffect(() => {
        lucide.createIcons();
      }, [items, filter, searchQuery, showModal]);

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!title || !price) return;

        const newItem = {
          id: `ITEM-0${items.length + 1}`,
          title,
          category,
          price: price.startsWith('₹') ? price : `₹${price}`,
          condition,
          hostel,
          seller: 'TIET Student',
          description: description || 'No description provided.',
          status: 'Available'
        };

        setItems([newItem, ...items]);
        setTitle('');
        setPrice('');
        setDescription('');
        setShowModal(false);
      };

      const filteredItems = items.filter(item => {
        const matchesCategory = filter === 'all' || item.category.toLowerCase() === filter.toLowerCase();
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="max-w-6xl mx-auto px-4 py-8">
          <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
              <div className="flex items-center gap-2 text-indigo-400 font-semibold mb-1">
                <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                <span>TIET Smart Campus Initiative</span>
              </div>
              <h1 className="text-3xl font-bold tracking-tight text-white">Campus Marketplace & Book Exchange</h1>
            </div>
            <div className="mt-4 md:mt-0 flex gap-3">
              <button
                onClick={() => setShowModal(true)}
                className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-colors shadow-lg shadow-indigo-600/20"
              >
                <i data-lucide="plus" className="w-4 h-4"></i> List an Item
              </button>
            </div>
          </header>

          <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <div className="flex flex-wrap gap-2 w-full md:w-auto">
              {['all', 'books', 'electronics', 'dorm gear'].map((tab) => (
                <button
                  key={tab}
                  onClick={() => setFilter(tab)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium capitalize transition-all ${
                    filter === tab 
                      ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' 
                      : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  {tab}
                </button>
              ))}
            </div>
            <div className="w-full md:w-72">
              <input 
                type="text" 
                placeholder="Search books, calculators..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            {filteredItems.map((item) => (
              <div 
                key={item.id} 
                className="bg-slate-800/40 border border-slate-700/60 rounded-xl p-5 flex flex-col justify-between hover:border-indigo-500/40 transition-all shadow-xl"
              >
                <div>
                  <div className="flex justify-between items-start mb-3">
                    <span className="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      {item.price}
                    </span>
                    <span className="text-xs text-slate-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                      {item.condition}
                    </span>
                  </div>
                  <h3 className="text-lg font-bold text-white mb-1">{item.title}</h3>
                  <p className="text-xs text-indigo-300 font-medium mb-3">{item.seller} • {item.hostel}</p>
                  <p className="text-sm text-slate-300 mb-4 line-clamp-3">{item.description}</p>
                </div>

                <div>
                  <button 
                    onClick={() => alert(`Contacting seller from ${item.hostel} for ${item.title}!`)}
                    className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2"
                  >
                    <i data-lucide="message-circle" className="w-4 h-4"></i> Contact Seller
                  </button>
                </div>
              </div>
            ))}
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">List Item for Sale / Exchange</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <form onSubmit={handleAddItem} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Item Title</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Engineering Drawing Instruments"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Category</label>
                      <select 
                        value={category}
                        onChange={(e) => setCategory(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      >
                        <option value="Books">Books</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Dorm Gear">Dorm Gear</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Price (₹)</label>
                      <input 
                        type="text" 
                        required
                        placeholder="e.g. 400"
                        value={price}
                        onChange={(e) => setPrice(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Condition</label>
                      <select 
                        value={condition}
                        onChange={(e) => setCondition(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      >
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Hostel Block</label>
                      <select 
                        value={hostel}
                        onChange={(e) => setHostel(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      >
                        <option value="Hostel J">Hostel J</option>
                        <option value="Hostel M (Anantam)">Hostel M (Anantam)</option>
                        <option value="Hostel L (Viyat)">Hostel L (Viyat)</option>
                        <option value="Hostel N">Hostel N</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Description</label>
                    <textarea 
                      rows="3"
                      placeholder="Add details about the item..."
                      value={description}
                      onChange={(e) => setDescription(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    ></textarea>
                  </div>
                  <div className="flex justify-end gap-3 mt-6">
                    <button 
                      type="button" 
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20"
                    >
                      Post Listing
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
